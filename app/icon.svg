<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- back arm -->
    <line x1="13" y1="13.5" x2="7.5" y2="16" />
    <!-- torso, leaning into the lunge -->
    <line x1="13" y1="13.5" x2="17.5" y2="18" />
    <!-- back leg, extended -->
    <line x1="17.5" y1="18" x2="10" y2="27" />
    <!-- front leg, bent knee lunge -->
    <polyline points="17.5,18 23,23 22,27" />
    <!-- front arm and blade -->
    <polyline points="13,13.5 21,10.5 29,5" />
  </g>
  <circle cx="11.5" cy="9.5" r="2.5" fill="#ffffff"/>
</svg>
